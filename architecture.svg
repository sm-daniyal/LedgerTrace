<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Simple Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E293B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <g transform="translate(40, 30)">
    <text x="0" y="20" fill="#0F172A" font-size="20" font-weight="700">LedgerTrace — System Architecture Diagram</text>
    <text x="0" y="38" fill="#64748B" font-size="12">Autonomous 3-Way Financial Reconciliation, Lineage DAG &amp; Gated Approval Workflow</text>
  </g>

  <!-- 1. TOP BOX: DATA INGESTION TIER -->
  <g transform="translate(40, 85)">
    <!-- Container Box -->
    <rect width="880" height="95" rx="4" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="22" rx="2" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5"/>
    <text x="12" y="15" fill="#0F172A" font-size="11" font-weight="700">«subsystem» Data Ingestion Pipeline</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 35)">
      <!-- Box 1 -->
      <rect width="260" height="46" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
      <text x="12" y="18" fill="#0F172A" font-size="12" font-weight="600">Merchant OMS Feed</text>
      <text x="12" y="34" fill="#64748B" font-size="10">Orders Database / CSV Export</text>

      <!-- Box 2 -->
      <g transform="translate(280, 0)">
        <rect width="260" height="46" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
        <text x="12" y="18" fill="#0F172A" font-size="12" font-weight="600">Gateway Settlement MIS</text>
        <text x="12" y="34" fill="#64748B" font-size="10">Razorpay / Stripe / PayU Feeds</text>
      </g>

      <!-- Box 3 -->
      <g transform="translate(560, 0)">
        <rect width="280" height="46" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
        <text x="12" y="18" fill="#0F172A" font-size="12" font-weight="600">Bank Statement Feeds</text>
        <text x="12" y="34" fill="#64748B" font-size="10">HDFC / ICICI / SBI UTR Credits</text>
      </g>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="480" y1="180" x2="480" y2="215" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. DETERMINISTIC INVARIANT ENGINE -->
  <g transform="translate(40, 215)">
    <rect width="880" height="80" rx="4" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="22" rx="2" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/>
    <text x="12" y="15" fill="#1E40AF" font-size="11" font-weight="700">«core engine» Deterministic Invariant Matcher</text>

    <g transform="translate(20, 34)">
      <text x="0" y="16" fill="#1E293B" font-size="12" font-weight="600">• Contract Rate Card Verification (MDR % + 18% GST)</text>
      <text x="0" y="34" fill="#1E293B" font-size="12" font-weight="600">• Zero Math Hallucination: Strict 2-Decimal Precision Arithmetic</text>
      
      <text x="560" y="16" fill="#1E40AF" font-size="11" font-family="monospace">Expected Fee = round((Gross * Rate)/100, 2)</text>
      <text x="560" y="34" fill="#1E40AF" font-size="11" font-family="monospace">Net Payout = Gross - (Fee + GST)</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="480" y1="295" x2="480" y2="330" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. FINANCIAL LINEAGE PROVENANCE DAG -->
  <g transform="translate(40, 330)">
    <rect width="880" height="105" rx="4" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="22" rx="2" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5"/>
    <text x="12" y="15" fill="#0F172A" font-size="11" font-weight="700">«provenance» 4-Tier Financial Lineage DAG</text>

    <!-- 4 Stages in Lineage -->
    <g transform="translate(20, 36)">
      <!-- Stage 1 -->
      <rect width="180" height="50" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
      <text x="12" y="20" fill="#0F172A" font-size="11" font-weight="700">1. Merchant Order</text>
      <text x="12" y="36" fill="#64748B" font-size="10">Order ID, Amount, Currency</text>

      <!-- Flow Arrow -->
      <line x1="185" y1="25" x2="220" y2="25" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <!-- Stage 2 -->
      <g transform="translate(225, 0)">
        <rect width="180" height="50" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
        <text x="12" y="20" fill="#0F172A" font-size="11" font-weight="700">2. Gateway Capture</text>
        <text x="12" y="36" fill="#64748B" font-size="10">Payment ID, Fee, Tax, Net</text>
      </g>

      <!-- Flow Arrow -->
      <line x1="410" y1="25" x2="445" y2="25" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <!-- Stage 3 -->
      <g transform="translate(450, 0)">
        <rect width="180" height="50" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.2"/>
        <text x="12" y="20" fill="#0F172A" font-size="11" font-weight="700">3. Settlement Batch</text>
        <text x="12" y="36" fill="#64748B" font-size="10">Batch ID, Aggregator Payout</text>
      </g>

      <!-- Flow Arrow -->
      <line x1="635" y1="25" x2="670" y2="25" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <!-- Stage 4 -->
      <g transform="translate(675, 0)">
        <rect width="165" height="50" rx="3" fill="#FFFFFF" stroke="#166534" stroke-width="1.2"/>
        <text x="12" y="20" fill="#166534" font-size="11" font-weight="700">4. Bank UTR Credit</text>
        <text x="12" y="36" fill="#64748B" font-size="10">Bank Ref UTR, Value Date</text>
      </g>
    </g>
  </g>

  <!-- Branching Arrows from DAG -->
  <path d="M 260 435 L 260 475" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 700 435 L 700 475" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. BOTTOM LEFT: STATISTICAL ANOMALY RADAR -->
  <g transform="translate(40, 475)">
    <rect width="420" height="150" rx="4" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="22" rx="2" fill="#FEE2E2" stroke="#991B1B" stroke-width="1.5"/>
    <text x="12" y="15" fill="#991B1B" font-size="11" font-weight="700">«radar» Statistical Anomaly Detector</text>

    <g transform="translate(16, 32)" font-size="11" fill="#1E293B">
      <text x="0" y="16">• <tspan font-weight="600">Z-Score MDR Drift:</tspan> Flags subtle fee rate deviations</text>
      <text x="0" y="36">• <tspan font-weight="600">SLA Breach Detector:</tspan> Flags settlement float > 48 hours</text>
      <text x="0" y="56">• <tspan font-weight="600">IQR Amount Outlier:</tspan> Isolates abnormal gross/refunds</text>
      <text x="0" y="76">• <tspan font-weight="600">Surge Ratio Monitor:</tspan> Detects flash sale error spikes</text>
      <text x="0" y="96">• <tspan font-weight="600">Duplicate Charge Identifier:</tspan> Catches double gateway debits</text>
    </g>
  </g>

  <!-- 5. BOTTOM RIGHT: FORENSIC INVESTIGATOR AGENT -->
  <g transform="translate(500, 475)">
    <rect width="420" height="150" rx="4" fill="#F5F3FF" stroke="#5B21B6" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="22" rx="2" fill="#EDE9FE" stroke="#5B21B6" stroke-width="1.5"/>
    <text x="12" y="15" fill="#5B21B6" font-size="11" font-weight="700">«agent» Forensic Root-Cause Investigator</text>

    <g transform="translate(16, 32)" font-size="11" fill="#1E293B">
      <text x="0" y="16">• <tspan font-weight="600">Deterministic Tool Trace:</tspan> Multi-step evidence retrieval</text>
      <text x="0" y="36">• <tspan font-weight="600">Bayesian Hypothesis Ranking:</tspan> Probabilistic root cause</text>
      <text x="0" y="56">• <tspan font-weight="600">Downstream Impact Score:</tspan> Evaluates operational cashflow</text>
      <text x="0" y="76">• <tspan font-weight="600">Cryptographic Hash:</tspan> Generates SHA-256 audit seal</text>
      <text x="0" y="96">• <tspan font-weight="600">Resolution Formulation:</tspan> Drafts proposed self-healing actions</text>
    </g>
  </g>

  <!-- Arrow to Approval Hub -->
  <line x1="710" y1="625" x2="710" y2="655" stroke="#166534" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. FINAL GATE: SOX APPROVAL HUB -->
  <g transform="translate(40, 655)">
    <rect width="880" height="85" rx="4" fill="#F0FDF4" stroke="#166534" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="22" rx="2" fill="#DCFCE7" stroke="#166534" stroke-width="1.5"/>
    <text x="12" y="15" fill="#166534" font-size="11" font-weight="700">«governance» SOX Human-in-the-Loop Approval Hub</text>

    <g transform="translate(20, 36)" font-size="11" fill="#14532D">
      <text x="0" y="16">• <tspan font-weight="700">Double-Entry Journal Vouchers (JVs):</tspan> Auto-drafted balancing vouchers (e.g. JV-20260825-0101) for ERP posting</text>
      <text x="0" y="34">• <tspan font-weight="700">Synthetic Webhook Replay:</tspan> 1-click state resync updating orphan orders from PENDING to SUCCESS</text>
      <text x="560" y="24" fill="#166534" font-size="12" font-weight="700">Audit Status: SOX COMPLIANT ✓</text>
    </g>
  </g>
</svg>
